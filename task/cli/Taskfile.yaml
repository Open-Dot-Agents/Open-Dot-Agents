version: '3'

env:
  GOCACHE: /tmp/gocache-open-dot-agents
  GOPATH: /tmp/gopath-open-dot-agents

tasks:
  build:
    desc: Build dota and the reference adapter executables
    run: once
    cmds:
      - cd cli && go build -o bin/dota ./cmd/dota
      - cd cli && go build -o bin/dota-adapter-codex ./cmd/dota-adapter-codex
      - cd cli && go build -o bin/dota-adapter-copilot ./cmd/dota-adapter-copilot
      - cd cli && go build -o bin/dota-adapter-claude ./cmd/dota-adapter-claude

  install:
    desc: Install dota with Go
    cmds:
      - cd cli && go install ./cmd/dota

  test:
    desc: Run all Go unit and conformance tests
    cmds:
      - cd cli && go test ./...

  test:schemas:
    desc: Validate every normative JSON Schema
    cmds:
      - for: sources
        cmd: jq empty {{.ITEM}}
    sources:
      - spec/v1/schema/*.json

  test:architecture:
    desc: Enforce the out-of-process adapter boundary
    cmds:
      - '! rg -n "internal/adapter($|[^s])" cli/cmd/dota cli/internal/dotacore cli/pkg/adapterprotocol'
      - rg -n 'adapterprotocol.Serve' cli/cmd/dota-adapter-*/main.go

  test:conformance:
    desc: Exercise v1 tree and language-neutral adapter conformance
    deps: [build]
    cmds:
      - |
        set -eu
        fixture_root="$(mktemp -d /tmp/dota-conformance.XXXXXX)"
        trap 'rm -rf -- "$fixture_root"' EXIT
        cp -a conformance/v1/valid/minimal/. "$fixture_root/"
        cli/bin/dota conformance tree --root "$fixture_root"
        cli/bin/dota adapter add \
          --root "$fixture_root" \
          --id org.open-dot-agents.fixture \
          --version 1.0.0 \
          --path "$PWD/conformance/adapters/python/dota_adapter_fixture.py"
        cli/bin/dota conformance adapter --root "$fixture_root" --adapter org.open-dot-agents.fixture
        cli/bin/dota export --root "$fixture_root" --adapter org.open-dot-agents.fixture
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.fixture
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.fixture
        cli/bin/dota import --root "$fixture_root" --adapter org.open-dot-agents.fixture
        cli/bin/dota validate --root "$fixture_root"
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.fixture --operation import
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.fixture --operation import
      - |
        set -eu
        fixture_root="$(mktemp -d /tmp/dota-reference-adapter.XXXXXX)"
        trap 'rm -rf -- "$fixture_root"' EXIT
        cp -a conformance/v1/valid/minimal/. "$fixture_root/"
        cli/bin/dota adapter add \
          --root "$fixture_root" \
          --id org.open-dot-agents.copilot \
          --version dev \
          --path "$PWD/cli/bin/dota-adapter-copilot"
        cli/bin/dota export --root "$fixture_root" --adapter org.open-dot-agents.copilot
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.copilot
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.copilot

  test:surface:
    desc: Smoke-test the public dota command surface
    deps: [build]
    cmds:
      - cli/bin/dota --version
      - cli/bin/dota --help
      - cli/bin/dota validate --root . --json
      - cli/bin/dota inspect --root . --json

  test:reference-adapters:
    desc: Exercise every external reference adapter against v1 trees
    deps: [build]
    cmds:
      - |
        set -eu
        fixture_root="$(mktemp -d /tmp/dota-reference-codex.XXXXXX)"
        trap 'rm -rf -- "$fixture_root"' EXIT
        cp -a examples/codex-project/. "$fixture_root/"
        cli/bin/dota adapter add --root "$fixture_root" --id org.open-dot-agents.codex --version dev --path "$PWD/cli/bin/dota-adapter-codex"
        cli/bin/dota conformance adapter --root "$fixture_root" --adapter org.open-dot-agents.codex
        cli/bin/dota export --root "$fixture_root" --adapter org.open-dot-agents.codex
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.codex
        test -f "$fixture_root/.codex/config.toml"
        test -f "$fixture_root/.codex/rules/acceptance.rules"
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.codex
        test ! -f "$fixture_root/.codex/config.toml"
      - |
        set -eu
        fixture_root="$(mktemp -d /tmp/dota-reference-copilot.XXXXXX)"
        trap 'rm -rf -- "$fixture_root"' EXIT
        cp -a examples/copilot-project/. "$fixture_root/"
        cli/bin/dota adapter add --root "$fixture_root" --id org.open-dot-agents.copilot --version dev --path "$PWD/cli/bin/dota-adapter-copilot"
        cli/bin/dota conformance adapter --root "$fixture_root" --adapter org.open-dot-agents.copilot
        cli/bin/dota export --root "$fixture_root" --adapter org.open-dot-agents.copilot
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.copilot
        jq -e '.mcpServers.openaiDeveloperDocs.type == "http"' "$fixture_root/.github/mcp.json" >/dev/null
        grep -F 'applyTo: acceptance.txt' "$fixture_root/.github/instructions/acceptance.instructions.md" >/dev/null
        test -f "$fixture_root/.github/hooks/acceptance.json"
        test -f "$fixture_root/.github/plugin/plugin.json"
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.copilot
        test ! -f "$fixture_root/.github/mcp.json"
      - |
        set -eu
        fixture_root="$(mktemp -d /tmp/dota-reference-claude.XXXXXX)"
        trap 'rm -rf -- "$fixture_root"' EXIT
        cp -a conformance/v1/valid/full/. "$fixture_root/"
        cli/bin/dota adapter add --root "$fixture_root" --id org.open-dot-agents.claude --version dev --path "$PWD/cli/bin/dota-adapter-claude"
        cli/bin/dota conformance adapter --root "$fixture_root" --adapter org.open-dot-agents.claude
        cli/bin/dota export --root "$fixture_root" --adapter org.open-dot-agents.claude
        cli/bin/dota check --root "$fixture_root" --adapter org.open-dot-agents.claude
        test -f "$fixture_root/CLAUDE.md"
        test -f "$fixture_root/.mcp.json"
        cli/bin/dota clean --root "$fixture_root" --adapter org.open-dot-agents.claude
        test ! -f "$fixture_root/CLAUDE.md"

  test:codex:real:
    desc: Run the authenticated Codex reference-adapter acceptance probe
    deps: [build]
    cmds:
      - bash cli/scripts/test-codex-real.sh

  test:copilot:real:
    desc: Run the authenticated Copilot reference-adapter acceptance probe
    deps: [build]
    cmds:
      - bash cli/scripts/test-copilot-real.sh

  verify:
    desc: Run the production v1 verification gate
    deps: [test, test:schemas, test:architecture, test:conformance, test:reference-adapters, test:surface]
    cmds:
      - cd cli && go vet ./...
      - git diff --check

  release:
    desc: Build versioned dota RC artifacts after verification
    requires:
      vars: [VERSION]
    deps: [verify]
    cmds:
      - mkdir -p cli/bin/release
      - cd cli && go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o bin/release/dota ./cmd/dota
      - cd cli && go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o bin/release/dota-adapter-codex ./cmd/dota-adapter-codex
      - cd cli && go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o bin/release/dota-adapter-copilot ./cmd/dota-adapter-copilot
      - cd cli && go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o bin/release/dota-adapter-claude ./cmd/dota-adapter-claude
      - cd cli && test "$(./bin/release/dota --version)" = "dota {{.VERSION}}"

  release:check:
    desc: Validate GoReleaser configuration
    preconditions:
      - sh: command -v goreleaser >/dev/null 2>&1
        msg: Install the pinned GoReleaser version to validate packaging
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build an unpublished cross-platform release snapshot
    deps: [verify, release:check]
    cmds:
      - goreleaser release --snapshot --clean
