.agents:
  agents:
    - https://docs.github.com/en/copilot/tutorials/customization-library/custom-agents/your-first-custom-agent
    - https://learn.chatgpt.com/docs/agent-configuration/subagents?surface=cli
  guardrails:
    - https://learn.chatgpt.com/docs/sandboxing
  hooks:
    - https://docs.github.com/en/copilot/tutorials/copilot-cli-hooks
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/use-hooks
    - https://learn.chatgpt.com/docs/hooks
  instructions:
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-custom-instructions
  memories:
    - https://learn.chatgpt.com/docs/customization/memories?surface=cli
    - https://docs.devin.ai/desktop/cascade/memories
  permissions:
    - https://code.claude.com/docs/en/settings
    - https://learn.chatgpt.com/docs/permissions
    - https://learn.chatgpt.com/docs/agent-approvals-security
  plugins:
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/plugins-marketplace
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/plugins-finding-installing
  profiles:
    - https://learn.chatgpt.com/docs/config-file/config-advanced
  prompts:
    - https://docs.github.com/en/copilot/tutorials/customization-library/prompt-files/your-first-prompt-file
  rules:
    - https://learn.chatgpt.com/docs/agent-configuration/rules
  settings:
    - https://learn.chatgpt.com/docs/config-file/config-reference
    - https://code.claude.com/docs/en/settings
  skills:
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills
    - https://learn.chatgpt.com/docs/build-skills
    - https://code.claude.com/docs/en/skills
    - https://agentskills.io
  tools:
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-mcp-servers
    - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-mcp-servers#adding-per-repository-mcp-servers
    - https://learn.chatgpt.com/docs/extend/mcp?surface=cli

  manifest:
    format_version: "v0.0.1"
    canonical_root: .agents

  targets:
    copilot:
      id: copilot
      name: GitHub Copilot CLI
      docs:
        - https://docs.github.com/
    codex:
      id: codex
      name: OpenAI Codex
      docs:
        - https://learn.chatgpt.com/docs/
    claude:
      id: claude
      name: Anthropic Claude Code
      docs:
        - https://code.claude.com/docs/

  status:
    instructions:
      copilot: supported
      codex: supported
      claude: supported
    rules:
      copilot: supported
      codex: unsupported
      claude: supported
    agents:
      copilot: mapped
      codex: mapped
      claude: mapped
    guardrails:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    hooks:
      copilot: supported
      codex: unsupported
      claude: supported
    memories:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    permissions:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    plugins:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    profiles:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    prompts:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    settings:
      copilot: unsupported
      codex: unsupported
      claude: unsupported
    skills:
      copilot: mapped
      codex: supported
      claude: mapped
    tools:
      copilot: mapped
      codex: partial
      claude: mapped

  status_notes:
    plugins:
      copilot: "GitHub Copilot CLI supports native plugins, but the v0.0.1 oda adapter does not project them."
    profiles:
      codex: "Codex supports native profiles, but the v0.0.1 oda adapter does not project them."
    prompts:
      copilot: "GitHub Copilot CLI supports native prompt files, but the v0.0.1 oda adapter does not project them."
      claude: "Claude Code supports prompt workflows, but the v0.0.1 oda adapter does not project them."
    tools:
      codex: "Codex supports MCP transport types stdio/local and http/streamable-http."
    skills:
      codex: "Codex discovers repository skills directly from .agents/skills; oda does not emit duplicate .codex/skills entries."
