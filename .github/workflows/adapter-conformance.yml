name: Native adapter conformance

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      targets:
        description: Native harness test group
        type: choice
        default: priority
        options:
          - priority
          - all
          - claude
  push:
    tags:
      - 'evidence-v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native:
    name: ${{ matrix.vendor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJSON((github.event_name == 'push' || inputs.targets == 'all' || github.event_name == 'workflow_call' || inputs.targets == '') && '["codex","copilot","claude"]' || inputs.targets == 'claude' && '["claude"]' || '["codex","copilot"]') }}
    env:
      GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout components
        env:
          SUBMODULE_TOKEN: ${{ secrets.OPEN_DOT_AGENTS_SUBMODULES_TOKEN }}
        run: |
          if [ -n "$SUBMODULE_TOKEN" ]; then
            encoded="$(printf 'x-access-token:%s' "$SUBMODULE_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded}" submodule update --init --depth=1 CLI SPEC WORKBENCH
          else
            git submodule update --init --depth=1 CLI SPEC WORKBENCH
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Read pinned harness package
        id: harness
        env:
          VENDOR: ${{ matrix.vendor }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package = json.loads(Path('WORKBENCH/conformance/versions.json').read_text())['harnesses'][os.environ['VENDOR']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('package', 'version', 'integrity'):
                  print(f'{name}={package[name]}', file=output)
          PYCODE
      - name: Verify and install pinned harness package
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          PACKAGE: ${{ steps.harness.outputs.package }}
          VERSION: ${{ steps.harness.outputs.version }}
          INTEGRITY: ${{ steps.harness.outputs.integrity }}
        run: |
          npm pack "$PACKAGE@$VERSION" --json > package.json
          test "$(jq -r '.[0].integrity' package.json)" = "$INTEGRITY"
          npm install --global "$(jq -r '.[0].filename' package.json)"
      - name: Install evidence dependencies
        run: python3 -m pip install -r SPEC/conformance/requirements.txt
      - name: Build reference CLI
        id: build
        working-directory: CLI
        run: go build -trimpath -ldflags '-X main.version=1.0.0' -o ../agents ./cmd/agents
      - name: Run native acceptance
        env:
          AGENTS_BIN: ${{ github.workspace }}/agents
          ODA_VERSION: 1.0.0
        run: python3 WORKBENCH/conformance/run_adapter.py ${{ matrix.vendor }} --output evidence/${{ matrix.vendor }}.json
      - name: Run extended acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          AGENTS_BIN: ${{ github.workspace }}/agents
          ODA_VERSION: 1.0.0
        run: python3 WORKBENCH/conformance/run_extended.py ${{ matrix.vendor }} --auth environment --output evidence/extended
      - name: Validate baseline and extended evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 WORKBENCH/conformance/release_gate.py --evidence-dir evidence --vendors ${{ matrix.vendor }}
      - name: Package evidence and reproduction inputs
        if: ${{ !cancelled() && hashFiles('evidence/*.json') != '' }}
        run: |
          mkdir -p evidence/reproduction
          cp WORKBENCH/conformance/versions.json evidence/reproduction/
          cp SPEC/conformance/requirements.txt evidence/reproduction/
          cp WORKBENCH/conformance/README.md evidence/reproduction/
          tar -czf adapter-evidence-${{ matrix.vendor }}.tar.gz evidence
          sha256sum adapter-evidence-${{ matrix.vendor }}.tar.gz > adapter-evidence-${{ matrix.vendor }}.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('adapter-evidence-*.tar.gz') != '' }}
        with:
          name: adapter-evidence-${{ matrix.vendor }}-${{ steps.harness.outputs.version }}
          path: adapter-evidence-${{ matrix.vendor }}.tar.gz*
          retention-days: 90
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: adapter-evidence-${{ matrix.vendor }}.tar.gz
