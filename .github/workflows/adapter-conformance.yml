name: Native adapter conformance

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Native harness test group
        type: choice
        default: priority
        options:
          - priority
          - all
          - claude
  push:
    tags:
      - 'evidence-v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native:
    name: ${{ matrix.vendor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJSON((github.event_name == 'push' || inputs.targets == 'all') && '["codex","copilot","claude"]' || inputs.targets == 'claude' && '["claude"]' || '["codex","copilot"]') }}
    env:
      GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout CLI and Workbench
        run: git submodule update --init --depth=1 CLI SPEC WORKBENCH
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Read pinned harness package
        id: harness
        env:
          VENDOR: ${{ matrix.vendor }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package = json.loads(Path('WORKBENCH/conformance/versions.json').read_text())['harnesses'][os.environ['VENDOR']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('package', 'version', 'integrity'):
                  print(f'{name}={package[name]}', file=output)
          PYCODE
      - name: Verify and install pinned harness package
        shell: bash
        env:
          PACKAGE: ${{ steps.harness.outputs.package }}
          VERSION: ${{ steps.harness.outputs.version }}
          INTEGRITY: ${{ steps.harness.outputs.integrity }}
        run: |
          npm pack "$PACKAGE@$VERSION" --json > package.json
          test "$(jq -r '.[0].integrity' package.json)" = "$INTEGRITY"
          npm install --global "$(jq -r '.[0].filename' package.json)"
      - name: Build reference CLI
        working-directory: CLI
        run: go build -trimpath -ldflags '-X main.version=1.0.0' -o ../agents ./cmd/agents
      - name: Run native acceptance
        env:
          AGENTS_BIN: ${{ github.workspace }}/agents
          ODA_VERSION: 1.0.0
        run: python3 WORKBENCH/conformance/run_adapter.py ${{ matrix.vendor }} --output evidence/${{ matrix.vendor }}.json
      - name: Validate evidence contract
        if: ${{ !cancelled() && hashFiles('evidence/*.json') != '' }}
        run: |
          python3 -m pip install -r SPEC/conformance/requirements.txt
          python3 WORKBENCH/conformance/validate_result.py evidence/${{ matrix.vendor }}.json SPEC/spec/1.0/schemas/conformance-result.schema.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('evidence/*.json') != '' }}
        with:
          name: adapter-evidence-${{ matrix.vendor }}-${{ steps.harness.outputs.version }}
          path: evidence/${{ matrix.vendor }}.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/${{ matrix.vendor }}.json
