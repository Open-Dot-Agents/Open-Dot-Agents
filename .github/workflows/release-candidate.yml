name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version, such as 1.0.0
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  adapter-evidence:
    name: Require ratified adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout CLI
        run: git submodule update --init --depth=1 CLI
      - name: Require three supported evidence records
        run: |
          test "$(jq -r '[.adapters[] | select(.status == "conformance-supported")] | length' CLI/compatibility.json)" = 3
          jq -e 'all(.adapters[]; (.harness_version | type == "string") and (.evidence_url | type == "string"))' CLI/compatibility.json

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: agents
            archive_extension: tar.gz
          - name: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: agents
            archive_extension: tar.gz
          - name: macos-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            binary: agents
            archive_extension: tar.gz
          - name: macos-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: agents
            archive_extension: tar.gz
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            binary: agents.exe
            archive_extension: zip
          - name: windows-arm64
            runner: windows-latest
            goos: windows
            goarch: arm64
            binary: agents.exe
            archive_extension: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout CLI submodule
        run: git submodule update --init --depth=1 CLI
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - name: Test
        working-directory: CLI
        run: go test ./...
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-candidate" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate version
        shell: bash
        run: |
          case "${{ steps.version.outputs.value }}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid version: ${{ steps.version.outputs.value }}" >&2; exit 1 ;;
          esac
      - name: Create distribution directory
        if: runner.os != 'Windows'
        working-directory: CLI
        run: mkdir -p dist
      - name: Create distribution directory
        if: runner.os == 'Windows'
        working-directory: CLI
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist
      - name: Build
        working-directory: CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=true -ldflags "-X main.version=${{ steps.version.outputs.value }}" -o dist/${{ matrix.binary }} ./cmd/agents
      - name: Verify embedded version
        if: runner.os != 'Windows' && ((runner.arch == 'X64' && matrix.goarch == 'amd64') || (runner.arch == 'ARM64' && matrix.goarch == 'arm64'))
        working-directory: CLI
        run: ./dist/${{ matrix.binary }} version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: CLI/dist/${{ matrix.binary }}
          format: spdx-json
          output-file: CLI/dist/agents-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Verify embedded version
        if: runner.os == 'Windows' && ((runner.arch == 'X64' && matrix.goarch == 'amd64') || (runner.arch == 'ARM64' && matrix.goarch == 'arm64'))
        working-directory: CLI
        shell: pwsh
        run: ./dist/${{ matrix.binary }} version
      - name: Package archive and create checksum
        if: runner.os == 'Linux'
        working-directory: CLI
        run: |
          archive="agents-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          (
            cd dist
            tar -czf "${archive}" "${{ matrix.binary }}"
            sha256sum "${archive}" > "${archive}.sha256"
          )
      - name: Package archive and create checksum
        if: runner.os == 'macOS'
        working-directory: CLI
        run: |
          archive="agents-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          (
            cd dist
            tar -czf "${archive}" "${{ matrix.binary }}"
            shasum -a 256 "${archive}" > "${archive}.sha256"
          )
      - name: Package archive and create checksum
        if: runner.os == 'Windows'
        working-directory: CLI
        shell: pwsh
        run: |
          $archive = "agents-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          Compress-Archive -LiteralPath "dist/${{ matrix.binary }}" -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline -Encoding ascii "dist/$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-${{ matrix.name }}
          path: |
            CLI/dist/agents-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive_extension }}
            CLI/dist/agents-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive_extension }}.sha256
            CLI/dist/agents-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          if-no-files-found: error

  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs:
      - adapter-evidence
      - build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-candidate" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release tag and notes
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_target="$(git rev-list -n 1 "$TAG")"
          checkout_target="$(git rev-parse HEAD)"
          if [ "$tag_target" != "$checkout_target" ]; then
            echo "release tag $TAG points at $tag_target, but this workflow checked out $checkout_target" >&2
            exit 1
          fi
          test -s "docs/releases/${TAG}.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agents-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        working-directory: dist
        run: |
          expected_assets=(
            agents-linux-amd64.tar.gz
            agents-linux-arm64.tar.gz
            agents-darwin-amd64.tar.gz
            agents-darwin-arm64.tar.gz
            agents-windows-amd64.zip
            agents-windows-arm64.zip
          )
          for asset in "${expected_assets[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum -c "$asset.sha256"
            platform="${asset#agents-}"
            platform="${platform%.tar.gz}"
            platform="${platform%.zip}"
            test -s "agents-${platform}.spdx.json"
          done
          test "$(find . -name '*.spdx.json' -type f | wc -l)" = 6
          for sbom in *.spdx.json; do jq -e '.spdxVersion and .packages' "$sbom" >/dev/null; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Write release notes
        run: cp "docs/releases/v${{ steps.version.outputs.value }}.md" release-notes.md
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          tag_target="$(git rev-list -n 1 "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --latest=false --target "$tag_target" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --latest=false --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
