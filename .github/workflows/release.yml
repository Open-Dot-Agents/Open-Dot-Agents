name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.0.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must be dispatched from main." >&2
              exit 1
            fi
            release_tag="$INPUT_VERSION"
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release version must use the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Verify release source
        run: task cli:verify
      - name: Create repository and module tags
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          ensure_tag() {
            tag="$1"
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$tag")"
              if [ "$tag_commit" != "$release_commit" ]; then
                echo "Tag $tag already points to $tag_commit, not $release_commit." >&2
                exit 1
              fi
              return
            fi
            git \
              -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$tag" "$release_commit" -m "Release $tag"
          }
          ensure_tag "$RELEASE_TAG"
          ensure_tag "cli/$RELEASE_TAG"
          git push --atomic origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/cli/$RELEASE_TAG"
      - name: Verify repository and module tags
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          repository_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          module_commit="$(git rev-list -n 1 "cli/$RELEASE_TAG")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$repository_commit" = "$module_commit"
          test "$repository_commit" = "$event_commit"
      - name: Create draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
