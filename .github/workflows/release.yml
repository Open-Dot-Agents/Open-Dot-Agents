name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v1.0.0-rc.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.52.0
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must be dispatched from main." >&2
              exit 1
            fi
            release_tag="$INPUT_VERSION"
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v1\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release version must be a v1 semantic version such as v1.0.0-rc.1." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Verify release source
        run: task cli:verify
      - name: Create repository and module tags
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          ensure_tag() {
            tag="$1"
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$tag")"
              if [ "$tag_commit" != "$release_commit" ]; then
                echo "Tag $tag already points to $tag_commit, not $release_commit." >&2
                exit 1
              fi
              return
            fi
            git \
              -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$tag" "$release_commit" -m "Release $tag"
          }
          ensure_tag "$RELEASE_TAG"
          ensure_tag "cli/$RELEASE_TAG"
          git push --atomic origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/cli/$RELEASE_TAG"
      - name: Verify repository and module tags
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          repository_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          module_commit="$(git rev-list -n 1 "cli/$RELEASE_TAG")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$repository_commit" = "$module_commit"
          test "$repository_commit" = "$event_commit"
      - name: Install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - name: Create draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
      - name: Generate and inspect publisher manifests
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/generate-publisher-manifests.sh "$RELEASE_TAG"
          bash scripts/inspect-release.sh
      - name: Upload publisher manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/publisher-manifests/*
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.spdx.sbom
            dist/dota-adapter-codex_*/dota-adapter-codex*
            dist/dota-adapter-copilot_*/dota-adapter-copilot*
            dist/dota-adapter-claude_*/dota-adapter-claude*
            dist/publisher-manifests/*.json
            dist/publisher-manifests/checksums.txt
