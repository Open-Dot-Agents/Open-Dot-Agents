name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-data:
    name: Release data and dogfood tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout CLI submodule
        run: git submodule update --init --depth=1 CLI
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate JSON files
        run: |
          python3 -m json.tool CLI/compatibility.json >/dev/null
          python3 -m json.tool .agents/tools/mcp.json >/dev/null
          python3 -m json.tool .agents/tools/llms-sources.json >/dev/null
      - name: Validate dogfood .agents tree
        working-directory: CLI
        run: go run ./cmd/agents validate --root .. --format json
      - name: Check compatibility data
        run: python3 CLI/scripts/check_compatibility.py --skip-workbench-pins

  specification:
    name: Specification conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout SPEC submodule
        run: git submodule update --init --depth=1 SPEC
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install conformance validator
        run: python3 -m pip install -r SPEC/conformance/requirements.txt
      - name: Run conformance suite
        working-directory: SPEC
        run: python3 conformance/run.py
      - name: Check experimental security schemas
        working-directory: SPEC
        run: python3 conformance/security_draft.py

  cli:
    name: Reference CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout CLI submodule
        run: git submodule update --init --depth=1 CLI
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - name: Test
        working-directory: CLI
        run: go test ./...
      - name: Version command
        working-directory: CLI
        run: go run ./cmd/agents version

  workbench:
    name: Workbench deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout WORKBENCH submodule
        id: workbench
        env:
          SUBMODULE_TOKEN: ${{ secrets.OPEN_DOT_AGENTS_SUBMODULES_TOKEN }}
        run: |
          if [ -n "$SUBMODULE_TOKEN" ]; then
            encoded="$(printf 'x-access-token:%s' "$SUBMODULE_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded}" submodule update --init --depth=1 WORKBENCH
          else
            git submodule update --init --depth=1 WORKBENCH
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.workbench.outputs.available == 'true'
        with:
          python-version: '3.12'
      - name: Checkout test dependencies
        if: steps.workbench.outputs.available == 'true'
        run: git submodule update --init --depth=1 CLI SPEC
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.workbench.outputs.available == 'true'
        with:
          go-version-file: CLI/go.mod
          cache-dependency-path: CLI/go.sum
      - name: Install evidence validator
        if: steps.workbench.outputs.available == 'true'
        run: python3 -m pip install -r SPEC/conformance/requirements.txt
      - name: Check compatibility including Workbench pins
        if: steps.workbench.outputs.available == 'true'
        run: python3 CLI/scripts/check_compatibility.py
      - name: Test all deterministic Workbench checks
        if: steps.workbench.outputs.available == 'true'
        working-directory: WORKBENCH
        run: python3 -m unittest discover -s task/test -p '*_test.py'
